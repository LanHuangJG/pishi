plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = GROUP
version = VERSION_NAME

base {
    archivesName = 'pishi-autopatch'
}

gradlePlugin {
    plugins {
        pishiAutoPatchPlugin {
            id = 'io.github.lanhuangjg.pishi.autopatch'
            implementationClass = 'pishi.gradle.plugin.PishiAutoPatchPlugin'
            displayName = 'Pishi AutoPatch Gradle Plugin'
            description = 'Pishi (Robust fork) patch generation plugin for AGP 8+'
        }
    }
}

apply plugin: 'com.vanniktech.maven.publish'

mavenPublishing {
    coordinates(GROUP, 'pishi-autopatch', VERSION_NAME)
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "pishi-autopatch"
        description = "Pishi (Robust fork) patch generation Gradle plugin for AGP 8+"
        inceptionYear = "2026"
        url = "https://github.com/LanHuangJG/pishi/"
        licenses {
            license {
                name = "Apache-2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "lanhuangjg"
                name = "LanHuangJG"
            }
        }
        scm {
            url = "https://github.com/LanHuangJG/pishi/"
            connection = "scm:git:https://github.com/LanHuangJG/pishi.git"
            developerConnection = "scm:git:git@github.com:LanHuangJG/pishi.git"
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

dependencies {
    // provided by the consuming Gradle build; excluded from published POMs
    compileOnly gradleApi()
    compileOnly localGroovy()
    // AGP is provided at runtime by the consumer build
    compileOnly 'com.android.tools.build:gradle:8.13.0'
    implementation 'org.javassist:javassist:3.30.2-GA'
    implementation 'commons-io:commons-io:2.16.1'
    // D8 (replaces the discontinued dx) is invoked from this jar at patch-build time
    implementation 'com.android.tools:r8:9.4.17'
    implementation project(':autopatchbase')
}
