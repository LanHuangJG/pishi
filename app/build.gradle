plugins {
    id 'com.android.application'
}

plugins.withId('io.github.lanhuangjg.pishi') {
    pishi {
        hotfixPackages = ['com.pishi.sample']
    }
}

android {
    namespace 'com.pishi.sample'
    compileSdk 36

    defaultConfig {
        applicationId "com.pishi.sample"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    lint {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation project(path: ':patch')
    testImplementation 'junit:junit:4.13.2'
}

configurations.all {
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

// To build the sample with Pishi instrumentation enabled:
//   1. ./gradlew publishToMavenLocal
//   2. add `classpath 'io.github.lanhuangjg:pishi-gradle-plugin:<version>'` to the root buildscript
//   3. uncomment the next line
apply plugin: 'io.github.lanhuangjg.pishi'
