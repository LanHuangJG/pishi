plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = GROUP
version = VERSION_NAME

base {
    archivesName = 'pishi-gradle-plugin'
}

gradlePlugin {
    plugins {
        pishiPlugin {
            id = 'io.github.lanhuangjg.pishi'
            implementationClass = 'pishi.gradle.plugin.PishiPlugin'
            displayName = 'Pishi Gradle Plugin'
            description = 'Android method-level hotfix instrumentation plugin (Robust fork for AGP 8+)'
        }
    }
}

apply plugin: 'com.vanniktech.maven.publish'

mavenPublishing {
    coordinates(GROUP, 'pishi-gradle-plugin', VERSION_NAME)
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "pishi-gradle-plugin"
        description = "Pishi (Robust fork) bytecode instrumentation Gradle plugin for AGP 8+"
        inceptionYear = "2026"
        url = "https://github.com/LanHuangJG/pishi/"
        licenses {
            license {
                name = "Apache-2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "lanhuangjg"
                name = "LanHuangJG"
            }
        }
        scm {
            url = "https://github.com/LanHuangJG/pishi/"
            connection = "scm:git:https://github.com/LanHuangJG/pishi.git"
            developerConnection = "scm:git:git@github.com:LanHuangJG/pishi.git"
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

dependencies {
    // provided by the consuming Gradle build; excluded from published POMs
    compileOnly gradleApi()
    compileOnly localGroovy()
    // AGP is provided at runtime by the consumer build
    compileOnly 'com.android.tools.build:gradle:8.13.0'
    implementation 'org.javassist:javassist:3.30.2-GA'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation project(':autopatchbase')
    // -Ppishi.patch delegates patch generation to the autopatch plugin classes
    implementation project(':auto-patch-plugin')
}
