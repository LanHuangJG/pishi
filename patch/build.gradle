plugins {
    id 'com.android.library'
}

group = GROUP
version = VERSION_NAME

base {
    archivesName = 'pishi-core'
}

apply plugin: 'com.vanniktech.maven.publish'

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    pom {
        name = "pishi-core"
        description = "Pishi (Robust fork) runtime patch loader for Android"
        inceptionYear = "2026"
        url = "https://github.com/LanHuangJG/pishi/"
        licenses {
            license {
                name = "Apache-2.0"
                url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "lanhuangjg"
                name = "LanHuangJG"
            }
        }
        scm {
            url = "https://github.com/LanHuangJG/pishi/"
            connection = "scm:git:https://github.com/LanHuangJG/pishi.git"
            developerConnection = "scm:git:git@github.com:LanHuangJG/pishi.git"
        }
    }
}

android {
    namespace 'com.pishi.hotfix'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0'
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':autopatchbase')
}
