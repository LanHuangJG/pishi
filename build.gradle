// Pishi (皮实) root build file — migrated from Robust 0.4.99 for AGP 8+
buildscript {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.37.0'
        // The sample app builds with the published plugins (kept active for local
        // verification; comment these two lines out to build the library modules only):
        classpath 'io.github.lanhuangjg:pishi-gradle-plugin:0.2.0'
        classpath 'io.github.lanhuangjg:pishi-autopatch:0.2.0'
        // or, equivalently, the plugin markers:
        // classpath 'io.github.lanhuangjg:pishi.gradle.plugin:0.2.0'
        // classpath 'io.github.lanhuangjg:pishi-autopatch.gradle.plugin:0.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    // upstream Robust sources have non-strict javadoc; don't fail Central builds on it
    tasks.withType(org.gradle.api.tasks.javadoc.Javadoc).configureEach {
        failOnError = false
        options.encoding = 'UTF-8'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
